@for (item of data; track item.id) {
  <div [style.margin-left.px]="level * 20">
    <div [class]="treeStyle === 'gray' ? 'tree-gray' : 'tree-yellow'">
      <ng-container *ngTemplateOutlet="itemTemplate || defaultTemplate; context: { $implicit: item }"></ng-container>
    </div>

    @if (hasChildren(item)) {
      <app-tree
        [data]="item.children || []"
        [itemTemplate]="itemTemplate"
        [level]="level + 1"
        [treeStyle]="treeStyle">
      </app-tree>
    }
  </div>
}

<ng-template #defaultTemplate let-item>
  <div>{{ item.name }}</div>
</ng-template>
