@for (item of data; track item.id) {
  <app-tree-node
    [node]="item"
    [level]="level"
    [treeStyle]="treeStyle"
    [selectedIds]="selectedIds"
    [disabled]="disabled"
    (selectionChange)="onSelectionChange($event)">
  </app-tree-node>
}
