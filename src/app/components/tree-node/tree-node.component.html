<div
  [style.margin-left.px]="level * 20"
  [appSearchHighlight]="search"
  [disabled]="disabled">

  <input type="checkbox"
         [checked]="isSelected"
         [indeterminate]="isIndeterminate"
         (change)="onCheckboxChange($event)"
         [disabled]="disabled"/>
  <span>{{ node.name }}</span>

  @if (hasChildren()) {
    @for (child of node.children; track child.id) {
      <app-tree-node
        [node]="child"
        [level]="level + 1"
        [selectedIds]="selectedIds"
        [disabled]="disabled"
        (selectionChange)="selectionChange.emit($event)">
      </app-tree-node>
    }
  }
</div>
