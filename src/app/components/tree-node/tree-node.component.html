<div [style.margin-left.px]="level * 20">
  <div>
    <input type="checkbox"
           [checked]="isSelected"
           [indeterminate]="isIndeterminate"
           (change)="onCheckboxChange($event)"
           [disabled]="disabled"/>
    <span>{{ node.name }}</span>
  </div>

  @if (hasChildren()) {
    @for (child of node.children; track child.id) {
      <app-tree-node
        [node]="child"
        [level]="level + 1"
        [selectedIds]="selectedIds"
        [disabled]="disabled"
        (selectionChange)="selectionChange.emit($event)">
      </app-tree-node>
    }
  }
</div>
