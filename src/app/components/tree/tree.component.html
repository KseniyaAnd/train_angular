@for (item of data; track item.name) {
    <div class="tree-node" [ngStyle]="{ 'margin-left': getIndent(level) }">
        <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>

        @if (hasChildren(item)) {
            <div>
                <app-tree [data]="item.children || []" [itemTemplate]="itemTemplate" [level]="level + 1"></app-tree>
            </div>
        }
    </div>
}
