<div [style.margin-left.px]="level * 20">
  <div [class]="treeStyle === 'gray' ? 'tree-gray' : 'tree-yellow'">
    <input type="checkbox"
           [checked]="isChecked()"
           [indeterminate]="isIndeterminate()"
           (change)="onCheckboxChange($event)"/>
    <span>{{ node.name }}</span>
  </div>

  @if (hasChildren()) {
    @for (child of node.children; track child.id) {
      <app-tree-node
        [node]="child"
        [level]="level + 1"
        [treeStyle]="treeStyle"
        [selectedIds]="selectedIds"
        (selectionChange)="selectionChange.emit($event)">
      </app-tree-node>
    }
  }
</div>
